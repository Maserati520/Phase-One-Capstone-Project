<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              sand: "#BCAF9C",
              blush: "#E8C7DE",
              plum: "#69626D",
              linen: "#CBBEB3",
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-sand text-gray-900 min-h-screen flex flex-col">
    <!-- NAVBAR -->
    <nav class="bg-plum text-white px-6 py-4">
      <div class="flex justify-between items-center">
        <h1 class="text-2xl font-bold">Book Explorer</h1>

        <!-- HAMBURGER BUTTON — only shows on mobile -->
        <button
          id="hamburger"
          class="md:hidden flex flex-col gap-1.5 focus:outline-none"
        >
          <span class="w-6 h-0.5 bg-white block"></span>
          <span class="w-6 h-0.5 bg-white block"></span>
          <span class="w-6 h-0.5 bg-white block"></span>
        </button>

        <!-- DESKTOP LINKS — only shows on desktop -->
        <ul class="hidden md:flex gap-6 text-lg">
          <li><a href="index.html" class="hover:underline">Home</a></li>
          <li>
            <a href="favorites.html" class="hover:underline">Favorites</a>
          </li>
          <li><a href="about.html" class="hover:underline">About</a></li>
        </ul>
      </div>

      <!-- MOBILE MENU — hidden by default -->
      <ul id="mobile-menu" class="hidden flex-col gap-4 mt-4 text-lg md:hidden">
        <li><a href="index.html" class="hover:underline block">Home</a></li>
        <li>
          <a href="favorites.html" class="hover:underline block">Favorites</a>
        </li>
        <li><a href="about.html" class="hover:underline block">About</a></li>
      </ul>
    </nav>

    <!-- HERO SECTION -->
    <section class="bg-blush text-gray-900 text-center py-20 px-6">
      <h2 class="text-4xl font-extrabold mb-4">
        Discover Your Next Favorite Book
      </h2>
      <p class="text-xl font-medium mb-6">
        Browse thousands of books from the Open Library
      </p>
      <a
        href="#books"
        class="bg-plum text-white font-semibold px-6 py-3 rounded-full hover:bg-linen hover:text-gray-900 transition"
      >
        Browse Books
      </a>
    </section>

    <!-- SEARCH BAR -->
    <section class="w-full px-4 py-8">
      <div class="max-w-2xl mx-auto flex flex-col sm:flex-row gap-3">
        <input
          id="search-input"
          type="text"
          placeholder="Search for a book..."
          class="flex-1 px-4 py-3 rounded-full border-2 border-plum bg-white text-gray-900 font-medium focus:outline-none focus:border-linen"
        />
        <button
          id="search-btn"
          class="bg-plum text-white px-6 py-3 rounded-full font-semibold hover:bg-linen hover:text-gray-900 transition w-full sm:w-auto"
        >
          Search
        </button>
      </div>
    </section>

    <!-- BOOKS GRID -->
    <section id="books" class="max-w-6xl mx-auto py-12 px-6 flex-1 w-full">
      <h3 class="text-2xl font-bold mb-6 text-gray-900">Popular Books</h3>
      <div
        id="books-grid"
        class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"
      >
        <!-- books will load here -->
      </div>
    </section>

    <!-- FOOTER -->
    <footer class="bg-plum text-white text-center py-6 mt-12">
      <p class="text-lg">© 2026 Book Explorer.</p>
    </footer>

    <!-- HAMBURGER SCRIPT -->
    <script>
      const hamburger = document.getElementById("hamburger");
      const mobileMenu = document.getElementById("mobile-menu");

      hamburger.addEventListener("click", () => {
        mobileMenu.classList.toggle("hidden");
        mobileMenu.classList.toggle("flex");
      });
    </script>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
